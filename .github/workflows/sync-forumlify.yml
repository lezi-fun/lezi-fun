name: Sync forumlify next → deploy

on:
  schedule:
    # 每 10 分钟检查一次
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-updates:
    runs-on: ubuntu-latest
    if: github.repository == 'lezi-fun/lezi-fun'
    outputs:
      has_updates: ${{ steps.upstream.outputs.has_updates }}
    steps:
      - name: Checkout deploy repo (next branch)
        uses: actions/checkout@v4
        with:
          repository: lezi-fun/forumlify-deploy
          ref: next
          token: ${{ secrets.FORUMLIFY_SYNC_PAT }}

      - name: Check upstream next branch head
        id: upstream
        run: |
          set -euo pipefail

          UPSTREAM_SHA=$(git ls-remote https://github.com/Furrium/forumlify.git refs/heads/next | awk '{print $1}')
          LOCAL_SHA=$(git rev-parse HEAD)
          SYNCED_UPSTREAM_SHA=$(git log -1 --format=%B | sed -n 's/^Upstream-SHA: //p' | tail -n 1)

          if [[ -z "$UPSTREAM_SHA" ]]; then
            echo "::error::Could not resolve the upstream next branch."
            exit 1
          fi

          echo "upstream=$UPSTREAM_SHA"
          echo "local=$LOCAL_SHA"
          echo "last_synced_upstream=${SYNCED_UPSTREAM_SHA:-none}"

          if [[ "$UPSTREAM_SHA" == "$LOCAL_SHA" || "$UPSTREAM_SHA" == "$SYNCED_UPSTREAM_SHA" ]]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "No upstream updates. Sync and push steps will be skipped."
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "Upstream update detected."
          fi

  sync:
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy repo (next branch)
        uses: actions/checkout@v4
        with:
          repository: lezi-fun/forumlify-deploy
          ref: next
          token: ${{ secrets.FORUMLIFY_SYNC_PAT }}

      - name: Fetch and sync from upstream
        run: |
          set -euo pipefail

          git config user.name "forumlify-sync-bot"
          git config user.email "forumlify-sync@users.noreply.github.com"
          git remote add upstream https://github.com/Furrium/forumlify.git
          git fetch upstream next
          UPSTREAM_SHA=$(git rev-parse upstream/next)
          DEPLOY_SHA=$(git rev-parse HEAD)

          # Replace the deploy branch's tracked tree with upstream/next while
          # keeping the current deploy commit as the parent of the sync commit.
          # This avoids pushing upstream commits that changed workflow files.
          git read-tree --reset -u upstream/next

          # Preserve the deploy repository's own workflows. The sync PAT does
          # not need `workflow` scope because upstream workflow changes are
          # intentionally excluded from the commit pushed to this repository.
          git restore --source="$DEPLOY_SHA" --staged --worktree .github

          if ! git diff --cached --quiet -- .github; then
            echo "::error::Deploy-specific workflow files changed during sync."
            git diff --cached --name-status -- .github
            exit 1
          fi

          git commit --allow-empty \
            -m "chore: sync forumlify next" \
            -m "Upstream-SHA: $UPSTREAM_SHA"

      - name: Push synced next to deploy repo
        run: |
          git push origin next
